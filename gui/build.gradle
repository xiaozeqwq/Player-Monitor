plugins {
    id 'fabric-loom' version '1.8.13'
}

base {
    archivesName = project.mod_id
}

// The GUI jar deliberately depends on the core mod at runtime; it is not bundled.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile and run against the core playermonitor mod.
    modImplementation project(path: ':core', configuration: 'namedElements')

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
}

// Name the output playermonitor-<version>-GUI.jar.
tasks.named('remapJar') {
    archiveClassifier = 'GUI'
}
